name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    # The release must not be able to ship something the gate would reject.
    # Only the unit gate runs here; the packet-path acceptance needs elevated
    # container capabilities and is run locally before tagging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
