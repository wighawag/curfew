services:
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # NET_ADMIN alone is not enough: SYS_ADMIN is what lets `ip netns add`
    # bind-mount its namespace (measured: it fails without it).
    #
    # The ip_forward sysctl is DEFENSIVE, not load-bearing on every host. A
    # container's network namespace inherits the host's value, which is 1 on
    # a typical developer machine, so the topology usually forwards without
    # it. Setting it explicitly means the suite does not silently depend on a
    # host setting it does not control.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../:/opt/curfew
    working_dir: /opt/curfew
    # Go acceptance binaries first (compiled on the host by docker/acceptance.sh,
    # since this image has no Go toolchain), then the legacy bats suite. The
    # `set -e` matters: without it a failing Go binary would be masked by bats
    # exiting 0 afterwards, which is precisely the kind of green-while-broken
    # gate this project keeps having to unlearn.
    command: sh -c 'set -e; chmod +x legacy/scripts/*.sh legacy/web/cgi-bin/ticket;
      for t in .acceptance/*.test; do [ -e "$$t" ] || continue; echo "== $$t"; "$$t"; done;
      bats legacy/test/'

  # Interactive shell for manual testing
  shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../:/opt/curfew
    working_dir: /opt/curfew
    entrypoint: sh
    stdin_open: true
    tty: true
