version: 2

# Two binaries with deliberately different target sets.
#
#   curfew         runs on your LAPTOP. It only drives ssh/scp, so it builds
#                     for whatever you run there, macOS included.
#   curfew-daemon  runs on the ROUTER. It talks netlink to a Linux kernel,
#                     so it is Linux-only, and it covers the architectures
#                     OpenWrt devices actually ship (the GL-MT6000 is arm64).
#
# Both are CGO-free and static, so the daemon depends on nothing in the
# router's userland.

project_name: curfew

before:
  hooks:
    - go mod tidy

builds:
  - id: curfew
    binary: curfew
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: curfew-daemon
    binary: curfew-daemon
    main: ./cmd/curfew-daemon
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux]
    goarch: [amd64, arm64, mips, mipsle]
    gomips: [softfloat] # OpenWrt MIPS targets are almost always softfloat

archives:
  # The two binaries ship in SEPARATE archives on purpose. Bundling them would
  # invite installing the daemon on a laptop, and keeping the enforcement code
  # off the laptop is the reason there are two binaries at all.
  - id: curfew
    ids: [curfew]
    name_template: "curfew_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

  - id: curfew-daemon
    ids: [curfew-daemon]
    name_template: "curfew-daemon_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  # Upload the installer as a standalone release asset, so it is served from
  # stable release object storage rather than a branch (no raw.githubusercontent
  # cache lag, and it always matches the release it ships with):
  #   curl -fsSL https://github.com/wighawag/curfew/releases/latest/download/install.sh | sh
  extra_files:
    - glob: ./install.sh
